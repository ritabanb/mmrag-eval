[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmrag-eval"
version = "0.1.0"
description = "Benchmark for evaluating grounding quality in multimodal RAG systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ritaban Banerjee", email = "ritabanb@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "datasets>=2.14",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/ritabanb/mmrag-eval"
Repository = "https://github.com/ritabanb/mmrag-eval"
Issues = "https://github.com/ritabanb/mmrag-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["mmrag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
